<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Billiard 61</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" sizes="512x512" href="./assets/icons/icon-512.png">
<meta name="theme-color" content="#111111">
  <link rel="icon" type="image/svg+xml" href="./assets/icons/icon-192.svg" />
  <link rel="stylesheet" href="./assets/css/main.css" />
  <script type="module" src="./assets/js/app.js"></script>
</head>
  <body>
  <div class="app">
    <div id="playerSelectOverlay" class="player-select">
      <div id="lobbyHome" class="lobby-home">
        <h1>Billiard 61</h1>
        <p>Play live multiplayer</p>
        <div class="player-select-options">
          <button id="showCreateGame" class="player-select-option">Create Game</button>
          <button id="showJoinGame" class="player-select-option">Join Multiplayer</button>
        </div>
      </div>

      <div id="createGamePanel" class="lobby-panel hidden">
        <h2>Create Game</h2>
        <label class="lobby-field">
          <span>Game Name</span>
          <input id="createGameName" type="text" maxlength="32" placeholder="Ex: friday match" />
        </label>
        <label class="lobby-field">
          <span>Players (1-4)</span>
          <select id="createGamePlayers">
            <option value="1">1 Player</option>
            <option value="2">2 Players</option>
            <option value="3">3 Players</option>
            <option value="4">4 Players</option>
          </select>
        </label>
        <div class="player-select-options">
          <button id="createGameSubmit" class="player-select-option">Create</button>
          <button id="createGameBack" class="player-select-option secondary">Back</button>
        </div>
      </div>

      <div id="joinGamePanel" class="lobby-panel hidden">
        <h2>Join Multiplayer</h2>
        <div id="joinGameList" class="join-game-list"></div>
        <div class="player-select-options">
          <button id="refreshJoinList" class="player-select-option secondary">Refresh</button>
          <button id="joinGameBack" class="player-select-option secondary">Back</button>
        </div>
      </div>
    </div>

    <div id="mainContent" class="hidden">
      <header class="header">
        <button id="backSelect" class="icon-button back-button" title="Change players">
          ↩
        </button>
        <h1>Billiard 61</h1>
        <div class="header-actions">
          <button id="undoLast" class="secondary" disabled>Undo</button>
          <button id="resetGame" class="primary">New Rack</button>
        </div>
      </header>

      <div class="main-layout">
        <aside class="log-panel">
          <div class="log-header">Log</div>
          <div id="logList" class="log-list"></div>
        </aside>

        <div class="main-panel">
          <div class="players" id="playersContainer"></div>

          <section class="table-section">
            <div class="table">
              <div class="table-inner">
                <div class="rack-track">
                  <div class="rack" id="rack"></div>
                </div>
              </div>
            </div>
          </section>

          <div class="status" id="statusBar"></div>
        </div>
      </div>

      <div id="leaveConfirm" class="modal-overlay hidden">
        <div class="modal">
          <div class="modal-title">Are you sure you want to leave?</div>
          <div class="modal-subtitle">You will leave this room and return to lobby.</div>
          <div class="modal-actions">
            <button id="stayHere" class="modal-btn stay">Stay</button>
            <button id="leaveNow" class="modal-btn leave">Leave</button>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
