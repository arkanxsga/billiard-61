<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Billiard 61</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" sizes="512x512" href="./assets/icons/icon-512.png">
<meta name="theme-color" content="#111111">
  <link rel="icon" type="image/svg+xml" href="./assets/icons/icon-192.svg" />
  <script>
    (() => {
      const bust = Date.now().toString();
      const head = document.head;

      const css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = `./assets/css/main.css?v=${bust}`;
      head.appendChild(css);

      const app = document.createElement("script");
      app.type = "module";
      app.src = `./assets/js/app.js?v=${bust}`;
      head.appendChild(app);
    })();
  </script>
</head>
  <body>
  <div class="app">
    <div id="playerSelectOverlay" class="player-select">
      <h1>Billiard 61</h1>
      <div id="connectPanel" class="connect-panel">
        <div class="connect-actions">
          <button id="createGameBtn" class="primary">Create Game</button>
          <button id="joinGameBtn" class="secondary">Join Game</button>
        </div>
      </div>

      <div id="lobbyMessage" class="lobby-message"></div>
    </div>

    <div id="mainContent" class="hidden">
      <header class="header">
        <button id="backSelect" class="icon-button back-button" title="Change players">
          ↩
        </button>
        <h1>Billiard 61</h1>
        <div class="header-actions">
          <button id="undoLast" class="secondary" disabled>Undo</button>
          <button id="redoLast" class="secondary" disabled>Redo</button>
          <button id="resetGame" class="primary">New Game</button>
        </div>
      </header>

      <div class="main-layout">
        <aside class="log-panel">
          <div class="log-header">Log</div>
          <div id="logList" class="log-list"></div>
        </aside>

        <div class="main-panel">
          <div class="players" id="playersContainer"></div>

          <section class="table-section">
            <div class="table">
              <div class="table-inner">
                <div class="rack-track">
                  <div class="rack" id="rack"></div>
                </div>
              </div>
            </div>
          </section>

          <div class="status" id="statusBar"></div>
        </div>
      </div>

      <div id="leaveConfirm" class="modal-overlay hidden">
        <div class="modal">
          <div class="modal-title">Are you sure you want to leave?</div>
          <div class="modal-subtitle">You will leave this room.</div>
          <div class="modal-actions">
            <button id="stayHere" class="modal-btn stay">Stay</button>
            <button id="leaveNow" class="modal-btn leave">Leave</button>
          </div>
        </div>
      </div>

      <div id="newGameConfirm" class="modal-overlay hidden">
        <div class="modal">
          <div class="modal-title">Start a new game?</div>
          <div class="modal-subtitle">Current game progress will be reset.</div>
          <div class="modal-actions">
            <button id="cancelNewGame" class="modal-btn stay">Cancel</button>
            <button id="confirmNewGame" class="modal-btn leave">New Game</button>
          </div>
        </div>
      </div>

    </div>

    <div id="createGameModal" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-title">Create Game</div>
        <div class="modal-subtitle">Set game name and players.</div>
        <label class="field-label" for="createGameNameInput">Game name</label>
        <input id="createGameNameInput" class="text-input" type="text" maxlength="32" placeholder="Enter game name here" />
        <label class="field-label" for="createPlayerCountSelect">Players</label>
        <select id="createPlayerCountSelect" class="text-input">
          <option value="1">1 Player</option>
          <option value="2">2 Players</option>
          <option value="3">3 Players</option>
          <option value="4">4 Players</option>
        </select>
        <div class="modal-actions">
          <button id="cancelCreateGame" class="modal-btn stay">Cancel</button>
          <button id="confirmCreateGame" class="modal-btn leave">Create</button>
        </div>
      </div>
    </div>

    <div id="joinGameModal" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-title">Join Game</div>
        <div class="modal-subtitle">Select a game room.</div>
        <div id="joinGamesList" class="join-games-list"></div>
        <div class="modal-actions">
          <button id="closeJoinGame" class="modal-btn stay">Close</button>
        </div>
      </div>
    </div>

    <div id="nameModal" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-title">Enter your name</div>
        <div class="modal-subtitle">This is saved for next time.</div>
        <input id="nameModalInput" class="text-input" type="text" maxlength="24" placeholder="Your name" />
        <div class="modal-actions">
          <button id="saveNameModalBtn" class="modal-btn leave">Save</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
